spring.application.name=vespa

# Lê o arquivo .env da raiz do projeto (se existir). Variáveis de ambiente do sistema também funcionam.
spring.config.import=optional:file:.env[.properties]

# createDatabaseIfNotExist=true cria o banco automaticamente se ele ainda não existir
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:vespa}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bahia
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Cria/atualiza as tabelas a partir das entidades (bom para desenvolvimento)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.config.import=optional:file:.env[.properties],optional:file:./vespa/.env[.properties]